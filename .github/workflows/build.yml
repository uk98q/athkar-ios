name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for device without signing
        run: |
          xcodebuild \
            -project Muslim.xcodeproj \
            -scheme Muslim \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "Muslim.app" | head -n 1)
          test -n "$APP_PATH"
          rm -rf Payload Muslim-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qr Muslim-unsigned.ipa Payload
          rm -rf Payload
          ls -la Muslim-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muslim-unsigned-ipa-run-${{ github.run_number }}
          path: Muslim-unsigned.ipa

      - name: Publish release with a new versioned IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.2.${GITHUB_RUN_NUMBER}"
          ASSET="Muslim-v1.2-build${GITHUB_RUN_NUMBER}-unsigned.ipa"
          cp Muslim-unsigned.ipa "$ASSET"
          gh release create "$TAG" "$ASSET" \
            --title "مسلم $TAG" \
            --notes "نسخة IPA غير موقعة للتثبيت عبر LiveContainer أو Sideloadly. كل المزايا مجانية." \
            --target "$GITHUB_SHA"
