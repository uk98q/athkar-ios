name: Muslim
options:
  bundleIdPrefix: com.uk98q
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
targets:
  Muslim:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Muslim
    info:
      path: Muslim/Info.plist
      properties:
        CFBundleDisplayName: مسلم
        CFBundleName: Muslim
        CFBundleExecutable: Muslim
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.3"
        CFBundleVersion: "13"
        CFBundleDevelopmentRegion: ar
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        NSLocationWhenInUseUsageDescription: نستخدم موقعك لحساب أوقات الصلاة على جهازك فقط، ولا نرسله إلى أي خادم.
        UIAppFonts:
          - ReadexPro-Regular.ttf
          - ReadexPro-Medium.ttf
          - ReadexPro-Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uk98q.muslim
        PRODUCT_NAME: Muslim
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.3"
        CURRENT_PROJECT_VERSION: "13"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
